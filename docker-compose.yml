version: '3'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./chrome_user_data:/app/chrome_user_data
    environment:
      - DATABASE_URL=mysql+pymysql://sales_user:sales_password@db:3306/salesdb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_worker
    restart: unless-stopped
    volumes:
      - ./:/app
      - ./chrome_user_data:/app/chrome_user_data
    environment:
      - DATABASE_URL=mysql+pymysql://sales_user:sales_password@db:3306/salesdb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - C_FORCE_ROOT=true
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app.celery worker --loglevel=info

  db:
    image: mysql:8.0
    container_name: sales_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=salesdb
      - MYSQL_USER=sales_user
      - MYSQL_PASSWORD=sales_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:6-alpine
    container_name: sales_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: 