services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssg-api:latest
    container_name: ssg-api
    restart: always
    # 添加特权模式和必要的Linux capabilities
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_TIME
    # 增加共享内存大小
    shm_size: 8gb
    # 增加资源限制
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
    security_opt:
      - seccomp=unconfined
    ports:
      - "3400:8000"
    volumes:
      - ./:/app
      - ./chrome_user_data:/app/chrome_user_data
      # 添加/dev/shm卷映射
      - /dev/shm:/dev/shm
      # 临时目录映射到容器外部
      - /tmp/chrome_tmp:/tmp/chrome_tmp
      # 添加时间同步
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # 添加selenium_setup.py
      - ./selenium_setup.py:/usr/local/bin/selenium_setup.py
    environment:
      - APP_NAME=销售数据获取系统
      - DEBUG=False
      - API_V1_STR=/api
      - DATABASE_URL=${DATABASE_URL}  # 连接外部MySQL服务
      - REDIS_URL=${REDIS_URL}        # 连接外部Redis服务
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      # 添加美团账号相关配置
      - MEITUAN_PHONE=13884950903
      - MEITUAN_ORG=叁石哥丰都麻辣鸡
      - MEITUAN_USERNAME=13884950903
      - MEITUAN_PASSWORD=sanshige123456
      # 滑块验证和登录模式
      - SLIDER_VERIFY_MODE=0
      - LOGIN_MODE=1
      # 添加Selenium相关环境变量
      - PYTHONUNBUFFERED=1
      - SE_OPTS=--disable-dev-shm-usage
      - WDM_LOG_LEVEL=0
      - WDM_SSL_VERIFY=0
      # 添加Redis连接参数
      - REDIS_SOCKET_TIMEOUT=60
      - REDIS_SOCKET_CONNECT_TIMEOUT=30
      - REDIS_SOCKET_KEEPALIVE=True
      - REDIS_RETRY_ON_TIMEOUT=True
      - REDIS_MAX_CONNECTIONS=20
      # 增加Celery的超时设置
      - CELERY_TASK_TIME_LIMIT=600
      - CELERY_TASK_SOFT_TIME_LIMIT=500
      - CELERY_BROKER_CONNECTION_TIMEOUT=60
      - CELERY_BROKER_CONNECTION_MAX_RETRIES=10
      - CELERY_BROKER_HEARTBEAT=30
      - CELERY_BROKER_POOL_LIMIT=10
      - CELERY_VISIBILITY_TIMEOUT=43200
      - TZ=Asia/Shanghai
      # 添加hostname固定值
      - CELERY_HOSTNAME=ssg-api
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120
    networks:
      - ssg-network
    # 添加健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssg-api:latest
    container_name: ssg-celery-worker
    restart: always
    # 添加特权模式和必要的Linux capabilities
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_TIME
    # 增加共享内存大小
    shm_size: 8gb
    # 增加资源限制
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./:/app
      - ./chrome_user_data:/app/chrome_user_data
      # 添加/dev/shm卷映射
      - /dev/shm:/dev/shm
      # 临时目录映射到容器外部
      - /tmp/chrome_tmp:/tmp/chrome_tmp
      # 添加时间同步
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # 添加selenium_setup.py
      - ./selenium_setup.py:/usr/local/bin/selenium_setup.py
    environment:
      - APP_NAME=销售数据获取系统
      - DEBUG=False
      - API_V1_STR=/api
      - DATABASE_URL=${DATABASE_URL}  # 连接外部MySQL服务
      - REDIS_URL=${REDIS_URL}        # 连接外部Redis服务
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      # 添加美团账号相关配置
      - MEITUAN_PHONE=13884950903
      - MEITUAN_ORG=叁石哥丰都麻辣鸡
      - MEITUAN_USERNAME=13884950903
      - MEITUAN_PASSWORD=sanshige123456
      # 滑块验证和登录模式
      - SLIDER_VERIFY_MODE=0
      - LOGIN_MODE=1
      # 添加Selenium相关环境变量
      - PYTHONUNBUFFERED=1
      - SE_OPTS=--disable-dev-shm-usage
      - WDM_LOG_LEVEL=0
      - WDM_SSL_VERIFY=0
      # 添加Redis连接参数
      - REDIS_SOCKET_TIMEOUT=60
      - REDIS_SOCKET_CONNECT_TIMEOUT=30
      - REDIS_SOCKET_KEEPALIVE=True
      - REDIS_RETRY_ON_TIMEOUT=True
      - REDIS_MAX_CONNECTIONS=20
      # 增加Celery的超时设置
      - CELERY_TASK_TIME_LIMIT=600
      - CELERY_TASK_SOFT_TIME_LIMIT=500
      - CELERY_BROKER_CONNECTION_TIMEOUT=60
      - CELERY_BROKER_CONNECTION_MAX_RETRIES=10
      - CELERY_BROKER_HEARTBEAT=30
      - CELERY_BROKER_POOL_LIMIT=10
      - CELERY_VISIBILITY_TIMEOUT=43200
      - TZ=Asia/Shanghai
      # 添加hostname固定值
      - CELERY_HOSTNAME=ssg-worker
      # 添加重试库环境变量
      - PYTHONPATH=/app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: bash -c "pip install retry tenacity timeout-decorator && celery -A celery_app worker --loglevel=info --concurrency=2 --time-limit=600 --soft-time-limit=500 --hostname=ssg-worker@%h -O fair --without-heartbeat --without-gossip"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ssg-network

networks:
  ssg-network:
    driver: bridge 